<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.152.0",
      "nipplejs": "https://esm.sh/nipplejs@0.10.1"
    }
  }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="menu" class="container">
    <div class="content">
      <h1 class="game-title">Mallow Out</h1>
      <div class="menu-buttons">
        <button id="mainBtn" class="big-btn wonky" data-fill="#ff69b4" data-stroke="#000000" data-stroke-width="4" aria-label="Start game" disabled>Loading...</button>
        <button id="resetGame" class="secondary-btn wonky" data-fill="#ffffff" data-stroke="#000000" data-stroke-width="2" style="display:none; padding: 10px;">Start New (Wipe Save)</button>
      </div>
    </div>

    <footer class="credit">
      <div class="credit-text" style="color: #000000; font-size: 10px;">A viscous game from</div>
      <img src="assets/img/sitcomreality.png" alt="SitcomREALTY logo" width="250" height="70" />
    </footer>
  </div>

  <div id="loadingOverlay" style="display:none; position: fixed; inset: 0; background: #87ceeb; z-index: 1000; align-items: center; justify-content: center; flex-direction: column;">
    <h2 style="font-size: 24px; color: #000000; text-transform: uppercase; animation: pulse 1s infinite;">Loading...</h2>
  </div>

  <div id="gameContainer" style="display:none;"></div>
  <div id="notificationContainer"></div>

  <div id="hud" style="display:none;"></div>
  <div id="marshmallowHUD" style="display:none;"></div>
  <div id="upgradeScreen"></div>
  <div id="pauseMenu"></div>

  <script type="module" src="main.js"></script>
